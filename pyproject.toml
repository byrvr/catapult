[project]
name = "catapult"
version = "0.3.4"
description = "Native macOS sideloading workspace for iOS and tvOS devices"
requires-python = ">=3.14"
dependencies = [
    "pymobiledevice3>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx[http2]>=0.27.0",
    "cryptography>=44.0.0",
    "zeroconf>=0.131.0",
    "pywebview>=5.0",
    "python-multipart>=0.0.9",
    "pyobjc-framework-Cocoa>=10.0",
    "srp>=1.0.0",
    "truststore>=0.9.0",
]

[project.scripts]
catapult = "catapult.main:main"
